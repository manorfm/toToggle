name: totoggle-java-release

# Triggered by a tag push (the "hook") matching totoggle_java/v*, e.g.:
#   git tag totoggle_java/v1.0.0 && git push origin totoggle_java/v1.0.0
#
# Builds, tests and packages the library (jar + sources + javadoc), then creates a GitHub
# Release with those artifacts attached. Actual Maven Central publishing (via the
# com.vanniktech.maven.publish plugin, see build.gradle.kts) is a separate, deliberately-disabled
# job below — it needs a Sonatype Central Portal user token (SONATYPE_USERNAME/PASSWORD secrets)
# that only a human can generate (central.sonatype.com login). The GPG signing key already exists
# (GPG_PRIVATE_KEY/GPG_PASSPHRASE secrets).

on:
  push:
    tags:
      - "totoggle_java/v*"

defaults:
  run:
    working-directory: totoggle_java

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # Gradle Wrapper 8.7 (this project's version) doesn't support newer JDKs.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Build (compiles, tests, jar + sourcesJar + javadocJar)
        run: ./gradlew build --no-daemon

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#totoggle_java/}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: "totoggle_java ${{ steps.version.outputs.version }}"
          body_path: totoggle_java/CHANGELOG.md
          files: totoggle_java/build/libs/*.jar

  # All 4 secrets (SONATYPE_USERNAME/PASSWORD, GPG_PRIVATE_KEY/PASSPHRASE) are configured —
  # runs on every totoggle_java/v* tag push.
  publish-maven-central:
    if: true
    needs: build-and-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Publish
        working-directory: totoggle_java
        run: ./gradlew publish --no-daemon
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.SONATYPE_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.SONATYPE_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_PASSPHRASE }}

  # Regenerates website/releases.json (the landing page's single source of truth for release
  # badges/install snippets) and the hardcoded version-pin examples in README.md/totoggle_java's
  # own README that mirror it. Runs after build-and-release rather than publish-maven-central —
  # the docs should reflect what was actually tagged/released regardless of whether the separate
  # Maven Central publish step succeeds. See scripts/sync-release-metadata.sh for the rationale.
  sync-docs:
    needs: build-and-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Sync and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ./scripts/sync-release-metadata.sh
          if git diff --quiet; then
            echo "Nothing to sync"
            exit 0
          fi
          git add website/releases.json website/index.html README.md server/README.md totoggle_java/README.md
          git commit -m "chore: synced release metadata for ${{ github.ref_name }}"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
          done
          echo "::error::Failed to push release metadata sync after 3 attempts" >&2
          exit 1
