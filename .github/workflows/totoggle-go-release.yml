name: totoggle-go-release

# Triggered by a tag push (the "hook") matching totoggle_go/v*, e.g.:
#   git tag totoggle_go/v1.0.0 && git push origin totoggle_go/v1.0.0
#
# Builds, tests and packages the module, then creates a GitHub Release with a source tarball
# attached. Publishing to pkg.go.dev needs no credentials — it indexes automatically from the
# tag once `go get` (or the GOPROXY warm-up step below) is run against it.

on:
  push:
    tags:
      - "totoggle_go/v*"

defaults:
  run:
    working-directory: totoggle_go

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: totoggle_go/go.mod

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -race -cover

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#totoggle_go/}" >> "$GITHUB_OUTPUT"

      - name: Package source tarball
        run: |
          mkdir -p ../dist
          tar --exclude='.git' -czf "../dist/totoggle_go-${{ steps.version.outputs.version }}.tar.gz" .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: "totoggle_go ${{ steps.version.outputs.version }}"
          body_path: totoggle_go/CHANGELOG.md
          files: dist/totoggle_go-${{ steps.version.outputs.version }}.tar.gz

      - name: Warm up the Go module proxy (triggers pkg.go.dev indexing)
        run: |
          GOPROXY=https://proxy.golang.org GOFLAGS=-mod=mod \
            go list -m "github.com/manorfm/toToggle/totoggle_go@${{ steps.version.outputs.version }}" || true

  # Regenerates website/releases.json (the landing page's single source of truth for release
  # badges/install snippets) and the hardcoded version-pin examples in README.md that mirror it —
  # server/go versions only ever change at tag-push time, never at a regular commit, so the
  # .githooks/pre-commit hook (which covers java/node's file-based versions) can never see this on
  # its own. See scripts/sync-release-metadata.sh for the full rationale.
  sync-docs:
    needs: build-and-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Sync and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ./scripts/sync-release-metadata.sh
          if git diff --quiet; then
            echo "Nothing to sync"
            exit 0
          fi
          git add website/releases.json website/index.html README.md server/README.md totoggle_java/README.md
          git commit -m "chore: synced release metadata for ${{ github.ref_name }}"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
          done
          echo "::error::Failed to push release metadata sync after 3 attempts" >&2
          exit 1
