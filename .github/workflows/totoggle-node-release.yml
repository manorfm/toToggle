name: totoggle-node-release

# Triggered by a tag push (the "hook") matching totoggle_node/v*, e.g.:
#   git tag totoggle_node/v1.0.0 && git push origin totoggle_node/v1.0.0
#
# Builds, tests and packages the library (npm pack tarball), then creates a GitHub Release with
# that tarball attached. Actual npm registry publishing uses npm Trusted Publishing (OIDC, no
# token/secret) — it's a separate, deliberately-disabled job below because it needs the ONE-TIME
# manual first publish + Trusted Publisher link described in the project README first (a package
# that has never been published has no "package settings" page on npmjs.com to link yet).

on:
  push:
    tags:
      - "totoggle_node/v*"

defaults:
  run:
    working-directory: totoggle_node

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: totoggle_node/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --coverage
      - run: npm run build

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#totoggle_node/}" >> "$GITHUB_OUTPUT"

      - name: Pack tarball
        run: npm pack

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: "totoggle-node ${{ steps.version.outputs.version }}"
          body_path: totoggle_node/CHANGELOG.md
          files: totoggle_node/*.tgz

  # Disabled until the package has been published to npm at least once manually (see README) and
  # a Trusted Publisher is linked to this exact repo + workflow filename on npmjs.com. Flip
  # `if: false` to `if: true` once that's done — no secret needed, npm authenticates via the
  # OIDC token this job's `id-token: write` permission lets GitHub Actions mint.
  publish-npm:
    if: false
    needs: build-and-release
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22" # Trusted Publishing needs npm CLI >= 11.5.1 / Node >= 22.14.0
          registry-url: "https://registry.npmjs.org"
      - working-directory: totoggle_node
        run: npm ci && npm run build
      - working-directory: totoggle_node
        run: npm publish --access public

  # Regenerates website/releases.json (the landing page's single source of truth for release
  # badges/install snippets) and the hardcoded version-pin examples in README.md that mirror it.
  # Runs after build-and-release, not publish-npm (which stays disabled until the one-time manual
  # first publish) — the docs should reflect what was actually tagged/released either way. See
  # scripts/sync-release-metadata.sh for the full rationale.
  sync-docs:
    needs: build-and-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Sync and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ./scripts/sync-release-metadata.sh
          if git diff --quiet; then
            echo "Nothing to sync"
            exit 0
          fi
          git add website/releases.json website/index.html README.md server/README.md totoggle_java/README.md
          git commit -m "chore: synced release metadata for ${{ github.ref_name }}"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
          done
          echo "::error::Failed to push release metadata sync after 3 attempts" >&2
          exit 1
